components:
  schemas:
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          nullable: true
        user_name:
          type: string
          readOnly: true
        action:
          type: string
          maxLength: 50
        model_name:
          type: string
          maxLength: 100
        object_id:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        object_repr:
          type: string
          maxLength: 255
        details: {}
        ip_address:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - id
      - model_name
      - timestamp
      - user_name
    Bid:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        rfq:
          type: integer
        rfq_number:
          type: string
          readOnly: true
        vendor:
          type: integer
          readOnly: true
        vendor_name:
          type: string
          readOnly: true
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        delivery_days:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Estimated delivery in days
        validity_days:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Bid valid for X days
        notes:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/Status32bEnum'
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/BidItem'
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - delivery_days
      - id
      - items
      - rfq
      - rfq_number
      - status
      - submitted_at
      - total_amount
      - updated_at
      - vendor
      - vendor_name
    BidItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        rfq_item:
          type: integer
        rfq_item_name:
          type: string
          readOnly: true
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - id
      - quantity
      - rfq_item
      - rfq_item_name
      - total_price
      - unit_price
    BidItemRequest:
      type: object
      properties:
        rfq_item:
          type: integer
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - quantity
      - rfq_item
      - unit_price
    BidList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        rfq_number:
          type: string
          readOnly: true
        vendor_name:
          type: string
          readOnly: true
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        delivery_days:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Estimated delivery in days
        status:
          $ref: '#/components/schemas/Status32bEnum'
        submitted_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - delivery_days
      - id
      - rfq_number
      - submitted_at
      - total_amount
      - vendor_name
    BidRequest:
      type: object
      properties:
        rfq:
          type: integer
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        delivery_days:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Estimated delivery in days
        validity_days:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Bid valid for X days
        notes:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/BidItemRequest'
      required:
      - delivery_days
      - items
      - rfq
      - total_amount
    DocumentTypeEnum:
      enum:
      - REGISTRATION
      - TAX
      - LICENSE
      - OTHER
      type: string
      description: |-
        * `REGISTRATION` - Company Registration
        * `TAX` - Tax Certificate
        * `LICENSE` - Business License
        * `OTHER` - Other
    Invoice:
      type: object
