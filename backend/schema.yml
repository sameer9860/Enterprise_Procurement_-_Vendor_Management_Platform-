openapi: 3.0.3
info:
  title: Enterprise Procurement & Vendor Management API
  version: 1.0.0
  description: "\n## Overview\nA centralized procurement workflow platform that digitalizes\
    \ purchasing for organizations.\n\n## Authentication\nThis API uses JWT Bearer\
    \ token authentication.\n1. Register at `/api/auth/register/`\n2. Login at `/api/auth/login/`\
    \ to get access + refresh tokens\n3. Include token in header: `Authorization:\
    \ Bearer <access_token>`\n4. Refresh token at `/api/auth/login/refresh/`\n5. Logout\
    \ at `/api/auth/logout/`\n\n## User Roles\n| Role | Description |\n|------|-------------|\n\
    | EMPLOYEE | Creates purchase requests |\n| MANAGER | Approves/rejects requests\
    \ |\n| PROCUREMENT | Manages RFQs, POs, vendor relationships |\n| FINANCE | Reviews\
    \ invoices and records payments |\n| VENDOR | Submits bids, acknowledges POs,\
    \ submits invoices |\n| ADMIN | Full system access |\n\n## Procurement Workflow\n\
    ```\nRequest → Approval → RFQ → Bidding → PO → Invoice → Payment\n```\n    "
paths:
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Create a new user account with a specific role.
      summary: Register new user
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
